---
# The identity GitHub Actions uses to deploy. It is a ServiceAccount rather than
# a personal login because a human token carries the human's whole namespace
# authority — including the Oracle wallet — and expires when the human's session
# does. This one holds exactly the verbs the playbook issues on exactly the kinds
# it applies, and nothing it does not need can be reached with it if the
# repository secret ever leaks.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rembayung-cd
  namespace: marwanbukhori-dev
  labels:
    app.kubernetes.io/part-of: rembayung-queue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rembayung-cd
  namespace: marwanbukhori-dev
  labels:
    app.kubernetes.io/part-of: rembayung-queue
rules:
  # Deployments are patched and watched; that is the whole job. `patch` covers
  # the image change in apply.yml and the restore in rollback.yml; `watch` is
  # what kubernetes.core's `wait: true` uses to observe the rollout converge.
  # `delete` is deliberately absent — CD changes images, it never removes
  # workloads, and a Deployment deleted by an automated agent is not something
  # this playbook can roll back.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # get/list to discover the running tag, watch for the rollout wait, patch to
    # set the image. `update` is retained deliberately: every write goes through
    # `state: patched` so only `patch` should be exercised, but a module that
    # ever fell back to a full replace would 403 at the worst possible moment —
    # mid-rollback. It grants no additional reach, being the same verb class on
    # the same resource the playbook already patches.
    verbs: ["get", "list", "watch", "patch", "update"]
  # Routes are now applied, not just read. The hostname is still what smoke.yml
  # uses; create/patch/update are what apply.yml needs to keep the Route in step
  # with git.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # The rest of what deploy/base declares.
  #
  # These are here because CD used to write only the image, so every other field
  # in a manifest — env, probes, resources, autoscaler bounds, network policy —
  # reached the cluster only when a human remembered to apply it. That gap made
  # a committed, CI-green, deployed change do nothing, and it stayed invisible
  # for 81 commits.
  #
  # get/list/watch as well as the writes: `apply` performs a three-way merge and
  # has to read the live object first.
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
# Deliberately absent: delete, on every kind above. CD changes declared state; it
# never removes an object. A resource deleted by an automated agent is not
# something this playbook can roll back.
# Deliberately absent: serviceaccounts, roles and rolebindings — which the
# overlay DOES render, and which CD therefore skips. See rembayung_applied_kinds
# in the role's defaults. A token in a public repository's Actions secrets that
# can rewrite RBAC is a token that can widen its own access; Kubernetes
# escalation prevention bounds that, but not granting it is cheaper than relying
# on the bound. RBAC here changes about twice a release and is applied by a
# human who already holds those rights, and deploy/scripts/check-drift.sh
# reports it when the cluster and git disagree — so the drift is loud rather
# than silent, which is the property that was actually missing.
# Deliberately absent: pods. An earlier draft granted read, with a comment
# claiming the playbook "checks pod status". It does not — smoke.yml reads
# readyReplicas off the Deployment's own status. Granting read on pods would
# have handed a CD token the ability to enumerate every pod in the namespace for
# no reason at all.
# Deliberately absent: secrets. The Oracle wallet and database credentials are
# created once by a human and are never read, written or mounted by CD. A
# compromised CD token cannot exfiltrate them.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rembayung-cd
  namespace: marwanbukhori-dev
  labels:
    app.kubernetes.io/part-of: rembayung-queue
subjects:
  - kind: ServiceAccount
    name: rembayung-cd
    namespace: marwanbukhori-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rembayung-cd

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.openshift.io/runtime: redis
spec:
  replicas: 1
  # The other three deployments carry a limit for the same reason and redis was
  # missed: the namespace allows 30 ReplicaSets, redis kept the default 10 old
  # ones, and every keepalive restart adds one. By 2026-09-25 the namespace sat
  # at 29 of 30, so a deploy could create the console's new ReplicaSet and then
  # was refused queue-gate's, and CD timed out waiting on a rollout that never
  # started. redis never changes image outside a pin in git, so 2 is plenty.
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.openshift.io/runtime: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Persistence is off, not merely unbacked. The design treats queue
          # state as disposable — positions can be lost, confirmed bookings live
          # only in Oracle — so there is no volume. Leaving Redis's default save
          # points active means it tries to snapshot to /data, is denied by the
          # restricted SCC, and then refuses ALL writes, taking the queue down.
          command:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

apiVersion: v1
kind: Service
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: rembayung-queue
    app.openshift.io/runtime: spring-boot
spec:
  selector: { app: console }
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    # Scrape target, and NOT on the Route. The part-of label above is what the
    # rembayung ServiceMonitor selects on, so adding this port is all it takes
    # for the console's own metrics to be collected alongside the two services
    # it watches. Publishing it on the Route would put JVM internals and the
    # console's request timings on the internet.
    - name: management
      port: 9090
      targetPort: 9090

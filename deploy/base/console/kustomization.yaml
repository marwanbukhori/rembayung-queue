apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Grouped into its own kustomization, unlike queue-gate and booking-service
# whose files are listed directly in ../kustomization.yaml. The reason is
# bootstrap: `oc apply -k deploy/base/console` creates exactly these five
# objects and cannot touch the image field of anything else, which the
# namespace-wide `oc apply -k deploy/overlays/sandbox` demonstrably can.
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

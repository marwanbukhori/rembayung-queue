apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels:
    app: booking-service
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/component: backend
    app.openshift.io/runtime: spring-boot
spec:
  replicas: 2
  # Pinned, not left to the API default. The zero-downtime property this
  # project demonstrates depends on maxUnavailable resolving to 0: a pod that
  # cannot pull its image never becomes Ready, and with 0 unavailable allowed
  # Kubernetes may not evict a working pod to make room for it. Measured — a
  # deploy of a nonexistent tag kept serving HTTP 200 throughout.
  #
  # The default happens to be 25%, which on 2 replicas rounds down to 0 and
  # gives the same behaviour. Relying on that was wrong twice over: it is a
  # value we do not control, and it silently stops holding at 5 replicas,
  # where 25% rounds to 1. Stating 0 keeps the property at any replica count.

  # Revision history, and not cosmetic here. This sandbox caps the namespace at 30 ReplicaSets, the
  # default keeps 10 revisions per Deployment, and every manifest change makes
  # one more. That ceiling was reached during this task: the controller stopped
  # creating ReplicaSets with `exceeded quota: count/replicasets.apps=30` and
  # the rollout silently stalled at "waiting for spec update to be observed" —
  # a rollout that never starts, reported as one that never finishes.
  #
  # 5 is safe because rollback does not depend on ReplicaSet history: the
  # playbook re-applies the previous tag rather than running `oc rollout undo`,
  # precisely so a pruned history cannot cost it a rollback.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: booking-service }
  template:
    metadata:
      labels:
        app: booking-service
        app.kubernetes.io/name: booking-service
        app.kubernetes.io/component: backend
        app.openshift.io/runtime: spring-boot
    spec:
      # Application-only OneAgent, not full-stack. Full-stack wants a
      # privileged DaemonSet or the Dynatrace operator; this sandbox grants
      # only restricted-v2 and denies `get nodes`, so neither is available.
      # What this buys is distributed traces and the service map. It does NOT
      # buy host, process or infrastructure metrics, and claiming otherwise
      # would be false.
      initContainers:
        - name: dynatrace-agent
          # alpine, not ubi-minimal. The PaaS installer is a ZIP and it has to
          # be unpacked as the arbitrary non-root UID restricted-v2 assigns.
          # ubi-minimal ships no unzip and `microdnf install` needs root, so
          # the obvious base image cannot extract its own download here.
          # busybox gives us TLS wget and unzip with nothing to install.
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -e
              if [ -z "$DT_API_URL" ] || [ -z "$DT_PAAS_TOKEN" ]; then
                echo "Secret 'dynatrace' is absent. Instrumenting the JVM makes"
                echo "the agent a hard dependency: -agentpath cannot be made"
                echo "conditional, so the pod cannot start without it."
                exit 1
              fi
              # The token travels in a header, never in the query string. A URL
              # carrying a credential is visible in `ps` to anything that can
              # list processes on the node, is written in full to the access log
              # of any proxy between here and Dynatrace, and is echoed back into
              # pod logs by some non-2xx responses. This token is valid for the
              # life of the tenant, so one leak is a working credential.
              wget -q -O /dynatrace/agent.zip \
                --header="Authorization: Api-Token ${DT_PAAS_TOKEN}" \
                "${DT_API_URL}/v1/deployment/installer/agent/unix/paas/latest?flavor=default&arch=x86&bitness=64"
              mkdir -p /dynatrace/agent
              unzip -q /dynatrace/agent.zip -d /dynatrace/agent
              # Freed before the JVM starts: the archive and its contents share
              # one emptyDir, and only the unpacked tree is needed from here.
              rm -f /dynatrace/agent.zip
              # Printed, not assumed. The layout inside the archive is version
              # dependent and a wrong -agentpath stops the JVM from starting at
              # all, so the path JAVA_TOOL_OPTIONS names is visible in these
              # logs for anyone checking it against the manifest. There is no
              # liboneagent.so in the archive at all; manifest.json marks
              # liboneagentloader.so as the loader for the java technology, and
              # that is the file the JVM must be pointed at.
              find /dynatrace/agent -name liboneagentloader.so
          env:
            - name: DT_API_URL
              valueFrom:
                secretKeyRef: { name: dynatrace, key: api-url, optional: true }
            - name: DT_PAAS_TOKEN
              valueFrom:
                secretKeyRef: { name: dynatrace, key: paas-token, optional: true }
          # Stated rather than inherited. The namespace LimitRange would
          # otherwise default this container to 1 CPU / 1000Mi, and a pod's
          # effective limit is the max of its init container and the sum of its
          # app containers — so the default would inflate what the deployment
          # charges the quota for the whole pod's lifetime.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: dynatrace-agent
              mountPath: /dynatrace
      containers:
        - name: booking-service
          image: ghcr.io/marwanbukhori/booking-service
          ports:
            - name: http
              containerPort: 8081
            - name: management
              containerPort: 9090
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:oracle:thin:@cv02eb7y952snfi2_low?TNS_ADMIN=/oracle/wallet
            # optional: true throughout. Without it the pods would refuse to
            # start until the Secret exists, which would take a working system
            # down for the sake of a logging integration.
            - name: SPLUNK_HEC_URL
              valueFrom:
                secretKeyRef: { name: splunk-hec, key: url, optional: true }
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef: { name: splunk-hec, key: token, optional: true }
            # The switch. logback-spring.xml puts the Splunk appender behind
            # <springProfile name="splunk">, so this key — a literal "splunk"
            # stored alongside the credentials purely so its presence tracks
            # theirs — is what turns shipping on. No Secret, no profile, no
            # appender, and no attempt to POST to an unconfigured endpoint.
            - name: SPRING_PROFILES_INCLUDE
              valueFrom:
                secretKeyRef: { name: splunk-hec, key: profile, optional: true }
            # The agent is loaded by the JVM itself, so this is a hard
            # dependency: unlike the Splunk keys above, `optional: true` on the
            # secret only changes how the failure reads, not whether the pod
            # can start. The path is the one the initContainer's `find` reports
            # — checked by running `java -agentpath:... -version` inside a live
            # container before any rollout was allowed to depend on it.
            - name: JAVA_TOOL_OPTIONS
              value: "-agentpath:/dynatrace/agent/agent/lib64/liboneagentloader.so"
          envFrom:
            - secretRef: { name: oracle-credentials }
          volumeMounts:
            - name: oracle-wallet
              mountPath: /oracle/wallet
              readOnly: true
            - name: dynatrace-agent
              mountPath: /dynatrace
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          # Added with the agent, not before it. Loading OneAgent costs about
          # 30 extra seconds of JVM start: measured, queue-gate went from
          # roughly 10s to "Started QueueGateApplication in 40.386 seconds".
          # That is past initialDelaySeconds + failureThreshold x periodSeconds
          # on the liveness probe below, so the first instrumented rollout
          # crash looped — every pod killed a second or two after Spring
          # finished starting, which reads as a broken image and is not one.
          #
          # A startupProbe is the fix rather than a longer initialDelay: it
          # holds liveness and readiness off until the app answers once and
          # then hands over to the tight liveness probe, so a slow start is
          # tolerated without making a hung process take 200s to notice.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            # Explicit, though 1s would do: the liveness group is livenessState
            # only and answers in 2.5-7.8ms because it deliberately does NOT
            # touch Oracle. That asymmetry is the point — a dependency outage
            # should make a pod unready, never restart it.
            timeoutSeconds: 3
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            # 5s, not the 1s default, and the default is what broke a real
            # deploy. The group used to include `db`, so the check crossed the
            # network to Oracle. Measured in-cluster: 0.26s, 0.26s, 0.51s, 0.51s,
            # 0.54s — already 26-54% of a 1s budget with nothing left for a GC
            # pause, pool contention, or a slow round trip.
            #
            # Under a rollout it reliably exceeded 1s: a cold JVM with an
            # initialising connection pool is the worst case, which is exactly
            # when the probe runs. CD deployed 2c60885, both new pods failed
            # readiness, the rollout wait timed out, and the playbook rolled the
            # whole thing back. The images were fine; the probe budget was not.
            #
            # `db` has since been taken out of the group entirely (see
            # application.yml): it borrowed a pooled connection, so a saturated
            # pool reported the pod as unready during the one run this system is
            # built to demonstrate. The generous budget stays — it costs nothing
            # and the rollout evidence above was real.
            timeoutSeconds: 5
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: oracle-wallet
          secret:
            secretName: oracle-wallet
        # Holds the archive and its unpacked contents at the same time,
        # briefly: 217MB downloaded on top of 514MB extracted, measured at
        # agent 1.343.106, so a ~731MB high-water mark before the zip is
        # deleted. sizeLimit is what turns an over-large future agent build
        # into an evicted pod with a clear reason instead of quiet node disk
        # pressure; 2Gi leaves roughly 2.8x headroom over what was measured.
        - name: dynatrace-agent
          emptyDir:
            sizeLimit: 2Gi

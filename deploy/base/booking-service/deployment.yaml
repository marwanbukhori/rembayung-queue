apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels: { app: booking-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: booking-service }
  template:
    metadata:
      labels: { app: booking-service }
    spec:
      containers:
        - name: booking-service
          image: ghcr.io/marwanbukhori/booking-service
          ports:
            - name: http
              containerPort: 8081
            - name: management
              containerPort: 9090
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:oracle:thin:@cv02eb7y952snfi2_low?TNS_ADMIN=/oracle/wallet
          envFrom:
            - secretRef: { name: oracle-credentials }
          volumeMounts:
            - name: oracle-wallet
              mountPath: /oracle/wallet
              readOnly: true
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: oracle-wallet
          secret:
            secretName: oracle-wallet

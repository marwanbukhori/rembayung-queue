apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels:
    app: booking-service
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/component: backend
    app.openshift.io/runtime: spring-boot
spec:
  replicas: 2
  # Pinned, not left to the API default. The zero-downtime property this
  # project demonstrates depends on maxUnavailable resolving to 0: a pod that
  # cannot pull its image never becomes Ready, and with 0 unavailable allowed
  # Kubernetes may not evict a working pod to make room for it. Measured — a
  # deploy of a nonexistent tag kept serving HTTP 200 throughout.
  #
  # The default happens to be 25%, which on 2 replicas rounds down to 0 and
  # gives the same behaviour. Relying on that was wrong twice over: it is a
  # value we do not control, and it silently stops holding at 5 replicas,
  # where 25% rounds to 1. Stating 0 keeps the property at any replica count.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: booking-service }
  template:
    metadata:
      labels:
        app: booking-service
        app.kubernetes.io/name: booking-service
        app.kubernetes.io/component: backend
        app.openshift.io/runtime: spring-boot
    spec:
      containers:
        - name: booking-service
          image: ghcr.io/marwanbukhori/booking-service
          ports:
            - name: http
              containerPort: 8081
            - name: management
              containerPort: 9090
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:oracle:thin:@cv02eb7y952snfi2_low?TNS_ADMIN=/oracle/wallet
          envFrom:
            - secretRef: { name: oracle-credentials }
          volumeMounts:
            - name: oracle-wallet
              mountPath: /oracle/wallet
              readOnly: true
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: oracle-wallet
          secret:
            secretName: oracle-wallet

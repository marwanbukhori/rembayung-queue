# The agent, shared by both JVM workloads: the init container that downloads
# it and the emptyDir it lands in. Applied to queue-gate and booking-service
# through the target in kustomization.yaml; the per-container half, which has
# to name each container, is in the two files beside this one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-used
spec:
  template:
    spec:
      # Application-only OneAgent, not full-stack. Full-stack wants a
      # privileged DaemonSet or the Dynatrace operator; this sandbox grants
      # only restricted-v2 and denies `get nodes`, so neither is available.
      # What this buys is distributed traces and the service map. It does NOT
      # buy host, process or infrastructure metrics, and claiming otherwise
      # would be false.
      initContainers:
        - name: dynatrace-agent
          # alpine, not ubi-minimal. The PaaS installer is a ZIP and it has to
          # be unpacked as the arbitrary non-root UID restricted-v2 assigns.
          # ubi-minimal ships no unzip and `microdnf install` needs root, so
          # the obvious base image cannot extract its own download here.
          # busybox gives us TLS wget and unzip with nothing to install.
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -e
              if [ -z "$DT_API_URL" ] || [ -z "$DT_PAAS_TOKEN" ]; then
                echo "Secret 'dynatrace' is absent. Instrumenting the JVM makes"
                echo "the agent a hard dependency: -agentpath cannot be made"
                echo "conditional, so the pod cannot start without it."
                exit 1
              fi
              # The token travels in a header, never in the query string. A URL
              # carrying a credential is visible in `ps` to anything that can
              # list processes on the node, is written in full to the access log
              # of any proxy between here and Dynatrace, and is echoed back into
              # pod logs by some non-2xx responses. This token is valid for the
              # life of the tenant, so one leak is a working credential.
              wget -q -O /dynatrace/agent.zip \
                --header="Authorization: Api-Token ${DT_PAAS_TOKEN}" \
                "${DT_API_URL}/v1/deployment/installer/agent/unix/paas/latest?flavor=default&arch=x86&bitness=64"
              mkdir -p /dynatrace/agent
              unzip -q /dynatrace/agent.zip -d /dynatrace/agent
              # Freed before the JVM starts: the archive and its contents share
              # one emptyDir, and only the unpacked tree is needed from here.
              rm -f /dynatrace/agent.zip
              # Printed, not assumed. The layout inside the archive is version
              # dependent and a wrong -agentpath stops the JVM from starting at
              # all, so the path JAVA_TOOL_OPTIONS names is visible in these
              # logs for anyone checking it against the manifest. There is no
              # liboneagent.so in the archive at all; manifest.json marks
              # liboneagentloader.so as the loader for the java technology, and
              # that is the file the JVM must be pointed at.
              find /dynatrace/agent -name liboneagentloader.so
          env:
            - name: DT_API_URL
              valueFrom:
                secretKeyRef: { name: dynatrace, key: api-url, optional: true }
            - name: DT_PAAS_TOKEN
              valueFrom:
                secretKeyRef: { name: dynatrace, key: paas-token, optional: true }
          # Stated rather than inherited. The namespace LimitRange would
          # otherwise default this container to 1 CPU / 1000Mi, and a pod's
          # effective limit is the max of its init container and the sum of its
          # app containers — so the default would inflate what the deployment
          # charges the quota for the whole pod's lifetime.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: dynatrace-agent
              mountPath: /dynatrace
      volumes:
        # Holds the archive and its unpacked contents at the same time,
        # briefly: 217MB downloaded on top of 514MB extracted, measured at
        # agent 1.343.106, so a ~731MB high-water mark before the zip is
        # deleted. sizeLimit is what turns an over-large future agent build
        # into an evicted pod with a clear reason instead of quiet node disk
        # pressure; 2Gi leaves roughly 2.8x headroom over what was measured.
        - name: dynatrace-agent
          emptyDir:
            sizeLimit: 2Gi

apiVersion: v1
kind: Service
metadata:
  name: queue-gate
  labels:
    app.kubernetes.io/name: queue-gate
    app.kubernetes.io/component: gateway
    app.openshift.io/runtime: spring-boot
spec:
  selector: { app: queue-gate }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    # Scrape target. Deliberately on the Service and NOT on the Route: adding it
    # to the Route would publish JVM internals and request timings to the
    # internet. The Route forwards only 8080; this port is reachable inside the
    # cluster, which is where Prometheus runs.
    - name: management
      port: 9090
      targetPort: 9090

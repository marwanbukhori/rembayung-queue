apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marwanbukhori-dev
resources:
  - ../../base
# These tags are a bootstrap default. CD does NOT read them.
#
# They used to be a trap. Two systems wrote the image field — this file, and the
# CD playbook at run time — and they drifted the moment CD deployed anything, so
# `oc apply -k` on a stale overlay rolled the cluster BACK to whatever was
# pinned here. That happened twice.
#
# The playbook now renders this overlay from a scratch copy whose pins it
# rewrites to the tag being deployed, and asserts the rewrite worked before
# anything reaches the cluster. There is one writer of the image field again, so
# whatever these say cannot revert a deploy.
#
# What they still decide is a manual `oc apply -k`, which is bootstrap only:
# a fresh namespace, before CD has ever run against it. To deploy, or to push a
# config change, run the playbook — it applies these manifests too, which is the
# thing it did not do for its first 81 commits:
#
#   ansible-playbook -i deploy/ansible/inventory.ini deploy/ansible/deploy.yml \
#     -e image_tag=$(git rev-parse HEAD)
#
# To check the cluster still matches this directory:
#
#   deploy/scripts/check-drift.sh
#
# All three services are listed, and all three matter. console was missing here
# once while the other two were pinned, and a missing entry is not a missing
# pin: the base names the image with no tag, so `oc apply -k` resolved it to
# :latest and deployed whatever had been pushed most recently, next to two
# services held at an exact SHA.
images:
  - name: ghcr.io/marwanbukhori/queue-gate
    newTag: fee8cb26d6fcc66d9e34a6e351839d4446b5b2d4
  - name: ghcr.io/marwanbukhori/booking-service
    newTag: fee8cb26d6fcc66d9e34a6e351839d4446b5b2d4
  - name: ghcr.io/marwanbukhori/console
    newTag: fee8cb26d6fcc66d9e34a6e351839d4446b5b2d4

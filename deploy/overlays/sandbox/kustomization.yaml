apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marwanbukhori-dev
resources:
  - ../../base
# BOOTSTRAP ONLY — DO NOT USE `oc apply -k` TO DEPLOY.
#
# Two systems write the image field: this file, and Phase 5's CD playbook at run
# time. They drift the moment CD deploys anything, and `oc apply -k` then quietly
# rolls the cluster BACK to whatever is pinned here. That has happened twice.
#
# Use `oc apply -k` only to bootstrap a fresh namespace or to push a
# non-image config change — and after any such apply, immediately re-run the
# playbook to restore the intended image:
#
#   ansible-playbook -i deploy/ansible/inventory.ini deploy/ansible/deploy.yml \
#     -e image_tag=$(git rev-parse HEAD)
#
# WARNING: these tags are the state git declares, NOT necessarily what is
# running. Phase 5's CD patches the image field on the live Deployments at run
# time, so after any CD deploy this file lags until someone syncs it.
#
# Consequence, and it has already been a live hazard: `oc apply -k` on a stale
# overlay REVERTS the cluster to whatever is pinned here. Check what is actually
# running before applying:
#
#   oc get deploy -o custom-columns=NAME:.metadata.name,\
#     IMAGE:.spec.template.spec.containers[0].image
#
# To deploy, prefer the playbook, which reads the current state first and can
# roll back:
#
#   ansible-playbook -i deploy/ansible/inventory.ini deploy/ansible/deploy.yml \
#     -e image_tag=<sha>
# All three services, and all three matter. console was missing here while the
# other two were pinned, and a missing entry is not a missing pin: the base
# names the image with no tag, so `oc apply -k` resolved it to :latest and
# deployed whatever had been pushed most recently, next to two services held at
# an exact SHA. One commit CI has published for every service, so applying this
# overlay gives a set that ran together.
images:
  - name: ghcr.io/marwanbukhori/queue-gate
    newTag: 51ea8d58e310d090a8c055128b17fde8c95d7b1b
  - name: ghcr.io/marwanbukhori/booking-service
    newTag: 51ea8d58e310d090a8c055128b17fde8c95d7b1b
  - name: ghcr.io/marwanbukhori/console
    newTag: 51ea8d58e310d090a8c055128b17fde8c95d7b1b

---
# Everything here changes when the sandbox is renewed (expected around
# 2026-10-01).
#
# These are not the only places a renewal touches, and pretending otherwise
# would send someone hunting in the wrong file. Also hardcoded elsewhere:
# the namespace in deploy/openshift/cd-serviceaccount.yaml (three times) and
# deploy/overlays/sandbox/kustomization.yaml, and the cluster API host in
# .github/workflows/cd.yml. The OPENSHIFT_TOKEN secret must be reissued too.
rembayung_namespace: marwanbukhori-dev
rembayung_route_name: queue-gate
rembayung_registry: ghcr.io/marwanbukhori

# Each Deployment carries its own image tag and they can legitimately differ.
#
# Every name here must already exist in the namespace: discover.yml reads each
# Deployment before anything is patched, so adding a service to this list before
# its Deployment has been created fails the play at discovery — safely, with
# nothing changed, but it does mean a new service is bootstrapped once by hand
# (`oc apply -k deploy/base/<service>`) before CD can carry it.
rembayung_services:
  - booking-service
  - queue-gate
  - console

# A rollout on this cluster takes well under a minute; 300s is slack for a slow
# image pull, not an expectation.
rembayung_rollout_timeout: 300

# Route admission and pod readiness are not instantaneous after an apply.
rembayung_smoke_retries: 10
rembayung_smoke_delay: 6

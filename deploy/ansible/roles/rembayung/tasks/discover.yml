---
# image_tag has no default on purpose. CI publishes full 40-character SHAs and
# deploy/scripts/build-push.sh publishes 7-character ones; a derived tag would
# silently target an image that does not exist. Fail before touching anything.
- name: Require an explicit image_tag
  ansible.builtin.assert:
    that:
      - image_tag is defined
      - image_tag | length > 0
    fail_msg: >-
      image_tag is required and is never derived.
      Pass it explicitly, e.g.
      ansible-playbook deploy/ansible/deploy.yml -e image_tag=<sha>
      Copy the tag from the CI run summary or from build-push.sh output.

- name: Read the image currently running on each Deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ rembayung_namespace }}"
    name: "{{ item }}"
  loop: "{{ rembayung_services }}"
  register: current_deployments

# One tag per Deployment, not one per cluster. booking-service and queue-gate
# are currently on different tags because Phase 3 deployed them separately by
# hand. A single rollback tag would restore one service to the other's tag,
# which is worse than the failure it was reverting.
- name: Build the per-service map of currently running tags
  ansible.builtin.set_fact:
    current_tags: >-
      {{ dict(rembayung_services | zip(
           current_deployments.results
           | map(attribute='resources.0.spec.template.spec.containers.0.image')
           | map('split', ':') | map('last') | list)) }}

# Read the Route here, in discovery, rather than in smoke.yml where it is used.
#
# The reason is ordering, not tidiness. smoke.yml runs AFTER apply.yml has
# already patched both Deployments. A missing or mistyped Route name discovered
# at that point fails the play with a new tag deployed and unverified, and it
# fails while evaluating a fact rather than through the rollback path — so
# nothing rolls back. Reading it during discovery means a bad Route name stops
# the play before anything has been changed.
#
# It is read rather than hardcoded because the sandbox expires around 2026-10-01
# and the hostname changes on renewal.
- name: Read the public Route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ rembayung_namespace }}"
    name: "{{ rembayung_route_name }}"
  register: route_info

# k8s_info returns an empty resources list for a missing named object rather
# than failing, so the absence has to be asserted explicitly. Without this the
# next task dies with "object has no element 0", which says nothing useful.
- name: Require that the Route exists
  ansible.builtin.assert:
    that:
      - route_info.resources | length > 0
    fail_msg: >-
      Route "{{ rembayung_route_name }}" not found in namespace
      "{{ rembayung_namespace }}". Nothing has been deployed. Check
      rembayung_route_name in roles/rembayung/defaults/main.yml — on a renewed
      sandbox the namespace changes too.

- name: Store the Route host
  ansible.builtin.set_fact:
    route_host: "{{ route_info.resources[0].spec.host }}"

# current_tags is read from spec, which is the DESIRED image, not necessarily the
# one serving. That matters because it becomes the rollback target: if a previous
# run was killed between its patch and its rollback — a job timeout, a cancelled
# workflow, a dropped network — the spec is left pinned to the bad tag while the
# old pods carry on serving. Trusting it blindly would make the next run adopt
# the broken tag as the thing to roll back TO.
#
# Converged means spec and status agree, so the desired image really is the
# running one. Refusing to proceed otherwise is the conservative choice: a
# deploy is postponed, rather than a bad tag being enshrined as good.
- name: Refuse to run against a Deployment that is mid-rollout
  ansible.builtin.assert:
    that:
      - item.resources[0].status.updatedReplicas | default(0) | int
        == item.resources[0].spec.replicas | int
      - item.resources[0].status.readyReplicas | default(0) | int
        == item.resources[0].spec.replicas | int
    fail_msg: >-
      {{ item.resources[0].metadata.name }} has not converged
      (spec {{ item.resources[0].spec.replicas }} replicas,
      {{ item.resources[0].status.updatedReplicas | default(0) }} updated,
      {{ item.resources[0].status.readyReplicas | default(0) }} ready).
      Its spec image cannot be trusted as a rollback target — a previous deploy
      may have been interrupted. Nothing has been changed. Investigate with
      `oc get deploy` and `oc describe deploy
      {{ item.resources[0].metadata.name }}` before deploying again.
  loop: "{{ current_deployments.results }}"
  loop_control:
    label: "{{ item.resources[0].metadata.name }}"

- name: Show what is running now
  ansible.builtin.debug:
    msg: "currently deployed: {{ current_tags }} via {{ route_host }}"

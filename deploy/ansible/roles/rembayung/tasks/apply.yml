---
# The manifests go on FIRST, then the image is patched onto them.
#
# For 81 commits this file patched only the image, and nothing in the deploy
# path ever applied deploy/base. The reasoning at the time is preserved because
# it was half right: the overlay pins a tag in git, CD deploys a tag chosen at
# run time, and `oc apply -k` on a stale overlay really does roll the cluster
# back — it happened twice. Patching only the image avoided that.
#
# What it also did was make every non-image field undeployable. env, probes,
# resources, RBAC, routes, autoscalers: committed, reviewed, CI-green, and
# never applied. The console's Splunk configuration was committed, deployed
# green, and did nothing, and the symptom was an empty Splunk search that read
# as a broken vendor integration for most of an afternoon.
#
# The conflict is resolved instead of avoided. The overlay is rendered from a
# scratch copy whose pins are rewritten to image_tag first, so the tag git
# happens to carry cannot reach the cluster and there is exactly one writer of
# the image field. The scratch copy is why: `kustomize edit` in place would
# leave the working tree dirty for anyone running this playbook by hand.
- name: Create a scratch copy of the manifests, so the working tree is never edited
  ansible.builtin.tempfile:
    state: directory
    suffix: -rembayung-manifests
  register: manifest_scratch

- name: Copy the base and the overlay into it
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.src }}/"
    dest: "{{ manifest_scratch.path }}/{{ item.dest }}/"
    mode: preserve
  loop:
    - { src: base, dest: base }
    - { src: overlays/sandbox, dest: overlays/sandbox }
  loop_control:
    label: "{{ item.src }}"

# Every newTag, matched by image name rather than by position, so a reordered
# or extended images: list cannot silently leave one service on a stale pin.
- name: Pin every image in the scratch overlay to the tag being deployed
  ansible.builtin.replace:
    path: "{{ manifest_scratch.path }}/overlays/sandbox/kustomization.yaml"
    regexp: '(- name:\s*{{ rembayung_registry }}/{{ item }}\s*\n\s*newTag:\s*)\S+'
    replace: '\g<1>{{ image_tag }}'
  loop: "{{ rembayung_services }}"

- name: Render the manifests
  ansible.builtin.command:
    cmd: kustomize build .
    chdir: "{{ manifest_scratch.path }}/overlays/sandbox"
  register: rendered_manifests
  changed_when: false

# The assertion this bug deserved. If a rename, a reordered list or a typo ever
# stops a pin being rewritten, the render still succeeds and would deploy some
# other tag — quietly, which is how the original went unnoticed for 81 commits.
# Checked before anything is sent to the cluster.
- name: Every service must be pinned to the tag being deployed
  ansible.builtin.assert:
    that:
      - rendered_manifests.stdout is search(rembayung_registry ~ '/' ~ item ~ ':' ~ image_tag)
    fail_msg: >-
      The rendered manifests do not pin {{ item }} to {{ image_tag }}. The
      images: list in deploy/overlays/sandbox/kustomization.yaml probably no
      longer names {{ rembayung_registry }}/{{ item }}. Nothing has been
      changed.
  loop: "{{ rembayung_services }}"

- name: Write the rendered manifests out for the apply
  ansible.builtin.copy:
    content: "{{ rendered_manifests.stdout }}"
    dest: "{{ manifest_scratch.path }}/rendered.yaml"
    mode: "0600"

# apply: true, not a plain create-or-replace. It is the three-way merge
# `oc apply` performs, so a field DELETED from git is removed from the cluster
# rather than lingering because nothing names it any more.
- name: Apply the manifests
  kubernetes.core.k8s:
    state: present
    apply: true
    src: "{{ manifest_scratch.path }}/rendered.yaml"

# Kept, and not redundant. The apply above already carries the right image, so
# this is normally a no-op that starts no second rollout. It stays as the one
# place that states the invariant unconditionally: whatever kustomize did or
# did not do, these three Deployments run image_tag.
- name: Set the image on each Deployment
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ rembayung_namespace }}"
    name: "{{ item }}"
    definition:
      spec:
        template:
          spec:
            containers:
              - name: "{{ item }}"
                image: "{{ rembayung_registry }}/{{ item }}:{{ image_tag }}"
  loop: "{{ rembayung_services }}"

# Bare `wait: true` with NO wait_condition, deliberately.
#
# The obvious spelling — wait_condition Progressing/NewReplicaSetAvailable — is
# racy, and the race is silent. NewReplicaSetAvailable is also the condition left
# behind by the PREVIOUS successful rollout. kubernetes.core's waiter issues its
# first GET immediately (waiter.py clock() yields 0 before any sleep) and
# custom_condition() is a stateless snapshot match with no "wait for change"
# semantics. The Deployment controller updates status asynchronously, so between
# the patch landing in etcd and that reconcile the object still carries the old
# reason — and a poll in that window returns success for a deploy that has not
# started. Sub-second on an idle control plane, wider under load, and it would
# hollow out the rollback in Task 4: a bad tag would be reported as deployed.
#
# Omitting wait_condition selects the collection's built-in Deployment predicate
# (RESOURCE_PREDICATES["Deployment"] = deployment_ready, waiter.py:144), which
# checks status.observedGeneration == metadata.generation alongside the replica
# counts. A stale status always carries the old generation, so it structurally
# cannot match straight after a spec change.
#
# Note that checking updatedReplicas == replicas and readyReplicas == replicas
# would NOT have fixed this on its own: without the generation check, a
# pre-reconcile snapshot can show those counts already satisfied from the
# previous rollout, which is the same race wearing different clothes.
- name: Wait for both rollouts to complete
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ rembayung_namespace }}"
    name: "{{ item }}"
    wait: true
    wait_timeout: "{{ rembayung_rollout_timeout }}"
  loop: "{{ rembayung_services }}"
  # No ignore_errors, and no conditional rollback include here. A timeout means
  # the new image will not run — a bad tag, an unpullable image, a crash loop —
  # and the rescue block in main.yml turns that into a rollback. Catching it
  # here caught only this one failure; the rescue catches every failure between
  # the first patch and the end of the smoke test.

- name: Remove the scratch copy
  ansible.builtin.file:
    path: "{{ manifest_scratch.path }}"
    state: absent

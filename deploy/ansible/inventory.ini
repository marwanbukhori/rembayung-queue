# The playbook talks to the cluster's API over HTTPS, not to managed hosts over
# SSH. localhost is the only "host" involved; kubernetes.core does the rest.
#
# ansible_python_interpreter is pinned to the interpreter running ansible-playbook
# itself, rather than left to discovery. Discovery picked /opt/homebrew/bin/python3.14
# here, which happens to have the kubernetes library — but that is luck, and a
# Homebrew Python bump would break k8s_info at runtime with a confusing error.
#
# It is deliberately NOT a hardcoded path: a GitHub Actions runner has no
# /opt/homebrew, and CI installs ansible and kubernetes into the same interpreter
# with pip. ansible_playbook_python is correct in both places by construction.
[local]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"

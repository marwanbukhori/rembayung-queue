spring:
  application:
    name: booking-service
  datasource:
    hikari:
      # The database is ~250ms away and a booking holds a connection for ~2.7s,
      # so 20 connections cap throughput near 7/sec. Under overload, waiting
      # 30 seconds (the default) for a connection is useless — the caller has
      # long since given up, and the thread is held the whole time. Fail in two
      # seconds instead and tell the client to retry.
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

booking:
  deposit-cents-per-head: 2000
  hold-ttl: PT10M

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        # prometheus rides the management port (9090), which is not on the public
        # Route. Adding it to a publicly routed port would publish internal
        # timings and JVM detail to the internet.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
          show-details: always

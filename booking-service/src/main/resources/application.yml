spring:
  application:
    name: booking-service
  datasource:
    hikari:
      # The database is ~250ms away and a booking holds a connection for ~2.7s,
      # so 20 connections cap throughput near 7/sec. Under overload, waiting
      # 30 seconds (the default) for a connection is useless — the caller has
      # long since given up, and the thread is held the whole time. Fail in two
      # seconds instead and tell the client to retry.
      connection-timeout: 2000
      # 5, not Hikari's default of 10, because the pool is PER JVM and the
      # database's session budget is shared across all of them.
      #
      #   sessions = replicas x maximum-pool-size
      #
      # The HPA is allowed 4 replicas, and Oracle Autonomous Database on the
      # Always Free tier caps sessions near 20. At the default of 10 a scale to
      # 4 would ask for 40 sessions against a 20 cap — so autoscaling, the thing
      # meant to absorb the 21:00 spike, would itself take the database down at
      # exactly the moment it engaged. 4 x 5 = 20 fits.
      #
      # Four pods with a pool of 5 beats two pods with a pool of 10: the same
      # database footprint, twice the HTTP concurrency, and one pod dying costs
      # a quarter of capacity instead of half. It does not raise booking
      # throughput — that is bounded by one row lock at about 1/second — but
      # throughput was never what more replicas were for.
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

booking:
  deposit-cents-per-head: 2000
  hold-ttl: PT10M

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        # prometheus rides the management port (9090), which is not on the public
        # Route. Adding it to a publicly routed port would publish internal
        # timings and JVM detail to the internet.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # readinessState only, and `db` deliberately absent.
        #
        # The db indicator borrows a pooled connection, so it fails whenever the
        # pool is saturated - measured, not assumed: with every connection
        # checked out this group returned 503 with
        # "CannotGetJdbcConnectionException: Failed to obtain JDBC Connection".
        # Saturating the pool is something this system does on purpose. The
        # console offers 200 admissions a second to show booking-service shed
        # load with 503 and Retry-After while oversold stays at zero, and under
        # the old grouping that run made every pod unready, emptied the Service,
        # and replaced the application's deliberate refusal with the router's
        # own error page. Load shedding and readiness were fighting each other.
        #
        # Removing it costs less than it looks. Oracle is shared by every
        # replica, so an outage fails them all at once: gating readiness on it
        # does not shift traffic to a healthy pod, it just empties the Service
        # and turns an application 503 that carries Retry-After into a router
        # 503 that carries nothing. A readiness probe that depends on a shared
        # backing service converts that dependency's blip into a total outage.
        #
        # The database is still checked and still visible - /actuator/health
        # reports db, and Prometheus scrapes it - it just no longer decides
        # whether this pod is allowed to answer.
        readiness:
          include: readinessState
          show-details: always
